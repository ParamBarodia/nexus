<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Nexus</title>
<style>
  :root { --bg:#0a0e14; --panel:#121821; --line:#1f2a37; --text:#cdd6e3; --dim:#6b7a8d;
          --accent:#33b1ff; --accent2:#7ee0c0; --warn:#ffb454; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif;
         min-height:100vh; padding:28px; }
  header { display:flex; align-items:baseline; gap:16px; margin-bottom:6px; }
  h1 { font-size:22px; letter-spacing:3px; color:var(--accent); font-weight:600; }
  #status { font-size:12px; color:var(--dim); }
  #status b { color:var(--accent2); }
  .sub { color:var(--dim); font-size:13px; margin-bottom:14px; }
  #today { max-width:900px; font-size:12.5px; color:var(--accent2); margin-bottom:18px;
           border-left:2px solid var(--accent); padding-left:10px; display:none; }
  #today.show { display:block; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; max-width:900px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px;
          padding:20px; cursor:pointer; transition:.15s; }
  .card:hover { border-color:var(--accent); transform:translateY(-2px);
                box-shadow:0 6px 24px rgba(51,177,255,.12); }
  .card h2 { font-size:15px; color:var(--accent); margin-bottom:6px; letter-spacing:.5px;
             display:flex; align-items:center; gap:8px; }
  .card p { font-size:12.5px; color:var(--text); line-height:1.5; }
  .card .meta { font-size:11px; color:var(--dim); margin-top:6px; }
  .badge { font-size:10px; font-weight:600; padding:2px 7px; border-radius:20px; letter-spacing:.3px; }
  .badge.ok { background:rgba(126,224,192,.12); color:var(--accent2); }
  .badge.stale { background:rgba(255,180,84,.14); color:var(--warn); }
  .badge.overdue { background:rgba(255,90,90,.16); color:#ff7b7b; }
  #out { max-width:900px; margin-top:18px; background:var(--panel); border:1px solid var(--line);
         border-radius:12px; padding:18px; font-size:13.5px; line-height:1.6; white-space:pre-wrap;
         min-height:60px; color:var(--text); display:none; }
  #out.show { display:block; }
  .bar { max-width:900px; margin-top:18px; display:flex; gap:10px; }
  #msg { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:10px;
         padding:13px 15px; color:var(--text); font-size:14px; outline:none; }
  #msg:focus { border-color:var(--accent); }
  #send { background:var(--accent); color:#02121f; border:none; border-radius:10px;
          padding:0 22px; font-weight:600; cursor:pointer; font-size:14px; }
  #send:hover { background:#5cc4ff; }
  .think { color:var(--warn); }
</style>
</head>
<body>
  <header>
    <h1>J.A.R.V.I.S.</h1>
    <div id="status">connecting…</div>
  </header>
  <div class="sub">Nexus Core — local sovereign AI. Select a domain or ask directly, Sir.</div>
  <div id="today"></div>

  <div class="grid">
    <div class="card" data-key="research" data-q="What is my next action on research, and what should I do about it right now?">
      <h2>◆ Research <span class="badge" id="b-research"></span></h2>
      <p class="next" id="n-research">…</p><div class="meta" id="m-research"></div>
    </div>
    <div class="card" data-key="job_hunt" data-q="What is the status of my job hunt and what is the single next move?">
      <h2>◆ Job Hunt <span class="badge" id="b-job_hunt"></span></h2>
      <p class="next" id="n-job_hunt">…</p><div class="meta" id="m-job_hunt"></div>
    </div>
    <div class="card" data-key="phd" data-q="What is my plan and timeline for this front, and what should I do now to prepare?">
      <h2>◆ PhD <span class="badge" id="b-phd"></span></h2>
      <p class="next" id="n-phd">…</p><div class="meta" id="m-phd"></div>
    </div>
    <div class="card" data-key="content" data-q="What is my next action on content, and how do I start right now?">
      <h2>◆ Content <span class="badge" id="b-content"></span></h2>
      <p class="next" id="n-content">…</p><div class="meta" id="m-content"></div>
    </div>
  </div>

  <div id="out"></div>

  <div class="bar">
    <input id="msg" placeholder="Ask J.A.R.V.I.S. anything…" autocomplete="off">
    <button id="send">Send</button>
  </div>

<script>
const out = document.getElementById('out');
const msg = document.getElementById('msg');

async function poll() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    document.getElementById('status').innerHTML =
      d.ok ? `online · <b>${d.mode}</b> · model ${d.model} · ${d.memory_facts} memories`
           : 'brain unreachable';
  } catch { document.getElementById('status').textContent = 'brain offline'; }
}
poll(); setInterval(poll, 60000);

async function loadDomains() {
  try {
    const r = await fetch('/api/domains');
    const d = await r.json();
    if (!d.ok) return;
    for (const [key, v] of Object.entries(d.domains)) {
      const n = document.getElementById('n-' + key);
      const b = document.getElementById('b-' + key);
      const m = document.getElementById('m-' + key);
      if (n) n.textContent = v.next_action || '(no next action set)';
      if (m) m.textContent = (v.deadline ? 'due ' + v.deadline : '') +
        (v.notes ? (v.deadline ? ' · ' : '') + v.notes.slice(0, 80) : '');
      if (b) {
        if (v.overdue) { b.className = 'badge overdue'; b.textContent = 'OVERDUE ' + v.days_overdue + 'd'; }
        else if (v.days_stale > 7) { b.className = 'badge stale'; b.textContent = v.days_stale + 'd stale'; }
        else { b.className = 'badge ok'; b.textContent = 'on track'; }
      }
    }
  } catch {}
}
loadDomains(); setInterval(loadDomains, 60000);

async function loadBriefing() {
  try {
    const r = await fetch('/api/briefing');
    const d = await r.json();
    const el = document.getElementById('today');
    if (d.ok && d.headline) { el.textContent = '📋 ' + d.headline; el.classList.add('show'); }
  } catch {}
}
loadBriefing(); setInterval(loadBriefing, 300000);

async function ask(q) {
  out.classList.add('show');
  out.innerHTML = '<span class="think">J.A.R.V.I.S. is thinking…</span>';
  try {
    const r = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:q})
    });
    const d = await r.json();
    out.textContent = d.reply || '(no response)';
  } catch (e) { out.textContent = 'Error reaching brain: ' + e; }
}

document.querySelectorAll('.card').forEach(c =>
  c.addEventListener('click', () => ask(c.dataset.q)));
document.getElementById('send').addEventListener('click', () => {
  if (msg.value.trim()) { ask(msg.value.trim()); msg.value=''; }
});
msg.addEventListener('keydown', e => {
  if (e.key === 'Enter' && msg.value.trim()) { ask(msg.value.trim()); msg.value=''; }
});
</script>
</body>
</html>
